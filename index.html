<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kelime Defteri</title>
<meta name="theme-color" content="#2b4eff">
<meta name="description" content="Kelime Defteri: sözlük, test, tekrar ve liderlik tablosu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelime Defteri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: tek sütunlu, telefon öncelikli kabuk; altta sekme çubuğu, üstte sayfa başlığı, içerik 720px ile sınırlı. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --surface2:#eaeef7; --ink:#141f3a; --muted:#56627f; --line:#d9dfec;
  --accent:#2b4eff; --accent-ink:#ffffff; --accent-soft:#e3e9ff;
  --ok:#0f7a58; --ok-bg:#dff4ea; --bad:#be2c47; --bad-bg:#fde6ea; --warn:#9a6a00; --warn-bg:#fff1cf;
  --l-A1:#3a9d7c; --l-A2:#2f9aa3; --l-B1:#3c86c4; --l-B2:#3b62d6; --l-C1:#6050cc; --l-C2:#8e3cb4;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1325; --surface:#151d33; --surface2:#1d2742; --ink:#e7ebf8; --muted:#9ba8c8; --line:#27324f;
  --accent:#7f95ff; --accent-ink:#0d1325; --accent-soft:#222d57;
  --ok:#4fd0a0; --ok-bg:#103228; --bad:#ff8097; --bad-bg:#3a1829; --warn:#f0be52; --warn-bg:#392d12;
  --l-A1:#5fcfa6; --l-A2:#55cdd6; --l-B1:#6aaee6; --l-B2:#7f9bff; --l-C1:#9a8cff; --l-C2:#c78af0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1325; --surface:#151d33; --surface2:#1d2742; --ink:#e7ebf8; --muted:#9ba8c8; --line:#27324f;
  --accent:#7f95ff; --accent-ink:#0d1325; --accent-soft:#222d57;
  --ok:#4fd0a0; --ok-bg:#103228; --bad:#ff8097; --bad-bg:#3a1829; --warn:#f0be52; --warn-bg:#392d12;
  --l-A1:#5fcfa6; --l-A2:#55cdd6; --l-B1:#6aaee6; --l-B2:#7f9bff; --l-C1:#9a8cff; --l-C2:#c78af0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
#app{max-width:720px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 28px)}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.2rem}
h3{font-size:1rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--font-mono);font-size:.9em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.88rem;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lv{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.78rem;font-weight:500;border:1px solid currentColor;border-radius:6px;padding:1px 7px}
.lv-A1{color:var(--l-A1)}.lv-A2{color:var(--l-A2)}.lv-B1{color:var(--l-B1)}.lv-B2{color:var(--l-B2)}.lv-C1{color:var(--l-C1)}.lv-C2{color:var(--l-C2)}
.badge{font-size:.75rem;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface2);color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;
  padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
nav button{position:relative;border:0;background:none;border-radius:10px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;padding:0;font-weight:600;color:var(--muted)}
.pbar{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.pbar .pn{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}.pbar .pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pbar .pr{display:flex;gap:6px}
/* Lig ve yönetici satır temaları */
.rk[data-lg],.pbar[data-lg]{position:relative;overflow:hidden;--lc:var(--line);border-color:var(--lc)}
[data-lg="1"]{--lc:#b87333;background:linear-gradient(100deg,rgba(184,115,51,.14),transparent 70%),var(--surface)!important}
[data-lg="2"]{--lc:#9aa4b2;background:linear-gradient(100deg,rgba(154,164,178,.22),transparent 70%),var(--surface)!important}
[data-lg="3"]{--lc:#d4a017;background:linear-gradient(100deg,rgba(212,160,23,.22),rgba(212,160,23,.04)),var(--surface)!important;box-shadow:0 0 8px rgba(212,160,23,.25)}
[data-lg="4"]{--lc:#3fb6c9;background:linear-gradient(100deg,rgba(63,182,201,.24),rgba(190,230,240,.08)),var(--surface)!important;box-shadow:0 0 10px rgba(63,182,201,.3)}
[data-lg="5"]{--lc:#12b981;background:linear-gradient(100deg,rgba(18,185,129,.28),rgba(18,185,129,.05)),var(--surface)!important;box-shadow:0 0 12px rgba(18,185,129,.38)}
[data-lg="6"]{--lc:#38bdf8;background:linear-gradient(100deg,rgba(56,189,248,.3),rgba(167,139,250,.12)),var(--surface)!important;box-shadow:0 0 14px rgba(56,189,248,.45)}
[data-lg="7"]{--lc:#a855f7;background:linear-gradient(100deg,rgba(168,85,247,.32),rgba(236,72,153,.1)),var(--surface)!important;box-shadow:0 0 16px rgba(168,85,247,.5)}
[data-lg="8"]{--lc:#f43f5e;background:linear-gradient(100deg,rgba(244,63,94,.32),rgba(249,115,22,.18)),var(--surface)!important;box-shadow:0 0 18px rgba(244,63,94,.55)}
[data-lg="9"]{--lc:#fbbf24;background:linear-gradient(100deg,rgba(251,191,36,.38),rgba(244,63,94,.18),rgba(168,85,247,.18)),var(--surface)!important;box-shadow:0 0 22px rgba(251,191,36,.65);border-width:2px}
[data-lg="6"]::after,[data-lg="7"]::after,[data-lg="8"]::after,[data-lg="9"]::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);animation:lgshine 4.5s ease-in-out infinite}
.rk[data-lg="admin"],.pbar[data-lg="admin"]{overflow:visible}
[data-lg="8"]::after{animation-duration:3.5s}[data-lg="9"]::after{animation-duration:2.6s}
@keyframes lgshine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
[data-lg="admin"]{--lc:#d4af37;background:linear-gradient(100deg,#000,#1b1608 60%,#000)!important;border:1.5px solid #d4af37;box-shadow:0 0 14px rgba(212,175,55,.45),inset 0 0 18px rgba(212,175,55,.08);color:#f6e7b0}
[data-lg="admin"] .nm,[data-lg="admin"] .pn b,[data-lg="admin"] .val{color:#f8e9b4}
[data-lg="admin"] .muted,[data-lg="admin"] .val small,[data-lg="admin"] .pos{color:#b9a463!important}
[data-lg="admin"] .badge{background:#2a2310;color:#e9cf7a}
@media (prefers-reduced-motion:reduce){[data-lg]::after{animation:none!important;display:none}}
[data-lg="0"]{--lc:#9ca3af;--ll:#e5e7eb;--ld:#4b5563;--rw:2px}
[data-lg="1"]{--lc:#cd7f32;--ll:#f3c89b;--ld:#8a4b14;--rw:2.5px}
[data-lg="2"]{--lc:#b8c0cc;--ll:#f8fafc;--ld:#6b7280;--rw:2.5px}
[data-lg="3"]{--lc:#e0a800;--ll:#fde68a;--ld:#8a6508;--rw:3px}
[data-lg="4"]{--lc:#3fb6c9;--ll:#d9f7fb;--ld:#1f7a8a;--rw:3px}
[data-lg="5"]{--lc:#12b981;--ll:#a7f3d0;--ld:#047857;--rw:3.5px}
[data-lg="6"]{--lc:#38bdf8;--ll:#e0f2fe;--ld:#1d6fb8;--rw:3.5px}
[data-lg="7"]{--lc:#a855f7;--ll:#f0d9ff;--ld:#6b21a8;--rw:4px}
[data-lg="8"]{--lc:#f43f5e;--ll:#ffd1b0;--ld:#9f1239;--rw:4px}
[data-lg="9"]{--lc:#fbbf24;--ll:#fff7c2;--ld:#b45309;--rw:4.5px}
[data-lg="admin"]{--ll:#f9e08a;--ld:#7a5a0c;--rw:3.5px}
.rk[data-lg]::before,.pbar[data-lg]::before,.cm[data-lg]::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--rw);pointer-events:none;z-index:1;
  background:repeating-linear-gradient(135deg,var(--ld) 0 2px,var(--ll) 2px 4px,var(--lc) 4px 6px,var(--ll) 6px 7px,var(--ld) 7px 9px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.cm[data-lg]{position:relative;overflow:hidden;--lc:var(--line)}
.cm[data-lg] .cn{color:var(--nc)}.cm .cu{font-weight:500;opacity:.8}
.cm[data-lg="admin"] .cn{color:#ff3b3b}.cm[data-lg="admin"] .cb{color:#f8e9b4}.cm[data-lg="admin"] .ct,.cm[data-lg="admin"] .ct button{color:#b9a463}
.rk[data-lg],.pbar[data-lg],.cm[data-lg],.sheet[data-lg]{--nc:color-mix(in srgb,var(--ld) 80%,var(--ink))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-lg]{--nc:var(--ll)}}
:root[data-theme="dark"] [data-lg]{--nc:var(--ll)}
.rk[data-lg],.pbar[data-lg]{border-color:transparent}
.rk[data-lg] .nm,.pbar[data-lg] .pn b{color:var(--nc)}
.sheet[data-lg]:not(.adm){--sg:color-mix(in srgb,var(--lc) 22%,var(--surface));background:linear-gradient(180deg,var(--sg),var(--surface) 55%);border-top:var(--rw,2px) solid transparent;border-image:repeating-linear-gradient(135deg,var(--ld) 0 2px,var(--ll) 2px 4px,var(--lc) 4px 6px,var(--ll) 6px 7px,var(--ld) 7px 9px) 6;box-shadow:0 -6px 28px color-mix(in srgb,var(--lc) 45%,transparent)}
.sheet[data-lg]:not(.adm) h2{color:var(--nc)}
.sheet[data-lg]:not(.adm) .kp div,.sheet[data-lg]:not(.adm) .bdg{background:color-mix(in srgb,var(--lc) 10%,var(--surface2));border-color:color-mix(in srgb,var(--lc) 35%,var(--line))}
/* Yönetici: sırma çerçeve, kırmızı isim, kanlı çerçeve, siyah kart */
[data-lg="admin"]::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:3.5px;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(135deg,#7a5a0c 0 2px,#f9e08a 2px 4px,#c79a1f 4px 6px,#fff3b8 6px 7px,#8a6510 7px 9px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.rk[data-lg="admin"].me,.pbar[data-lg="admin"],[data-lg="admin"]{box-shadow:0 0 14px rgba(212,175,55,.5),inset 0 0 18px rgba(212,175,55,.08)}
[data-lg="admin"] .nm,[data-lg="admin"] .pn b{color:#ff3b3b!important;text-shadow:0 0 8px rgba(255,0,0,.45)}
.sheet.adm{background:linear-gradient(180deg,#120d06,#000 40%);color:#f3e3b0;position:relative;border-top:4px solid transparent;border-image:repeating-linear-gradient(135deg,#7a5a0c 0 2px,#f9e08a 2px 4px,#c79a1f 4px 6px,#fff3b8 6px 7px,#8a6510 7px 9px) 4;box-shadow:0 -6px 30px rgba(212,175,55,.35)}
.sheet.adm .avw{margin:14px 16px 18px 10px}
.sheet.adm h2{color:#ff3b3b;text-shadow:0 0 10px rgba(255,0,0,.5)}
.sheet.adm .muted,.sheet.adm .kp span{color:#b9a463}
.sheet.adm .kp div,.sheet.adm .bdg{background:#17110a;border:1px solid #3d3012;color:#f3e3b0}
.sheet.adm .btn{background:#17110a;border-color:#8a6510;color:#f3e3b0}
.sheet.adm .badge{background:#2a2310;color:#e9cf7a}
.frm.bld .wob{animation:bwob 3.2s ease-in-out infinite;transform-origin:0 0}
.frm.bld .drp{transform-box:fill-box;transform-origin:50% 0;animation:bdrip 3.2s ease-in-out infinite}
.frm.bld .drp.d1{animation-delay:-.8s}.frm.bld .drp.d2{animation-delay:-1.6s}.frm.bld .drp.d3{animation-delay:-2.2s}
@keyframes bwob{0%,100%{transform:rotate(-2.5deg) scale(1)}50%{transform:rotate(2.5deg) scale(1.02)}}
@keyframes bdrip{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}
@media (prefers-reduced-motion:reduce){.frm.bld .wob,.frm.bld .drp{animation:none}}
nav .nbd{position:absolute;top:2px;right:6px;font-style:normal;background:var(--bad);color:#fff;border-radius:8px;padding:0 5px;font-size:.62rem}
.chatlist{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;height:calc(100vh - 330px);min-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cm{flex:none;max-width:84%;align-self:flex-start;background:var(--surface2);border-radius:12px;padding:6px 10px;overflow-wrap:anywhere}
.cm.me{align-self:flex-end;background:var(--accent-soft)}
.cm .cn{font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer}
.cm .cb{white-space:pre-wrap;font-size:.92rem}
.cm .ct{font-size:.66rem;color:var(--muted);display:flex;gap:8px;justify-content:flex-end}
.cm .ct button{border:0;background:none;color:var(--muted);padding:0}
.cdt{flex:none;align-self:center;font-size:.68rem;color:var(--muted)}
.cfm{display:flex;gap:8px;margin-top:8px}.cfm input{flex:1}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
/* today */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1}
.ring .n small{display:block;font-family:var(--font-body);font-weight:500;font-size:.7rem;color:var(--muted);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi b{display:block;font-family:var(--font-display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.wotd .w{font-family:var(--font-display);font-size:1.7rem;font-weight:700}
/* bars */
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.lvrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.lvrow .num{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);text-align:right}
.days{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:6px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.days i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.days i.w{background:var(--bad);opacity:.8;border-radius:2px}
.days small{font-size:.66rem;color:var(--muted)}
/* dict */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:46px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.entry .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%;border:0;background:none;padding:0;text-align:left}
.entry .w{font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.entry .tr{color:var(--muted)}
.entry dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.entry dt{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.entry dd{margin:0;min-width:0;overflow-wrap:anywhere}
.say{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 9px;font-size:.8rem;min-height:30px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .bar{flex:1}
.qcard h2{font-size:1.3rem;white-space:pre-line;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;text-align:left;align-items:start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:52px;overflow-wrap:anywhere}
.opt kbd{font-family:var(--font-mono);font-size:.8rem;background:var(--surface2);border-radius:6px;display:grid;place-items:center;height:26px;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;background:var(--surface2)}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}
.fb b.t{display:block;margin-bottom:4px}
.score{font-family:var(--font-display);font-size:3rem;font-weight:700;line-height:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;min-height:44px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:600}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-family:var(--font-mono);font-size:.78rem}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
/* rank */
.rk{cursor:pointer;display:grid;grid-template-columns:30px 54px 1fr auto;gap:10px;column-gap:20px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.rk .avw{justify-self:center}
.rk.me{border-color:var(--accent);background:var(--accent-soft)}
.rk .pos{font-family:var(--font-display);font-weight:700;font-size:1.1rem;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.rk.top .pos{color:var(--accent)}
.rk .nm{min-width:0;overflow-wrap:anywhere;font-weight:600}
.rk .val{font-family:var(--font-display);font-weight:700;font-size:1.3rem;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.rk .val small{display:block;font-family:var(--font-body);font-weight:500;font-size:.7rem;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.av.lg{width:56px;height:56px;font-size:1.5rem}
.av{box-sizing:border-box;border:2px solid var(--surface)}.av.em{font-size:1.35rem}.av.lg.em{font-size:1.9rem}.av.xl{width:84px;height:84px;font-size:2.6rem}.av.xl.em{font-size:2.9rem}
.avw{position:relative;display:inline-grid;border-radius:50%;flex:none;background:transparent}
.avw.fr-demir{background:linear-gradient(135deg,#374151,#9ca3af,#4b5563)}
.avw.fr-bronz{background:linear-gradient(135deg,#a45a1d,#f3c89b,#cd7f32)}
.avw.fr-gumus{background:linear-gradient(135deg,#6b7280,#f3f4f6,#9ca3af)}
.avw{--p:3.5px;padding:var(--p)}.avw:has(.av.lg){--p:4.5px}.avw:has(.av.xl){--p:7px}
.av.sm{width:28px;height:28px}
.frm{position:absolute;left:50%;top:50%;width:200%;height:200%;transform:translate(-50%,-50%);pointer-events:none;overflow:visible;z-index:2;filter:drop-shadow(0 0 3px var(--gc))}
.crown{z-index:3}
.frm .spin{transform-origin:0 0}
@media (prefers-reduced-motion:no-preference){
.frm .glint{transform-origin:0 0;animation:frot 4.2s linear infinite}
.frm .glint.f{animation-duration:2.6s}
.frm .orbit{transform-origin:0 0;animation:frot 7s linear infinite}
.frm .orbit.r{animation-direction:reverse;animation-duration:11s}
.frm .rays{transform-origin:0 0;animation:frot 30s linear infinite reverse}
.frm .tw{transform-box:fill-box;transform-origin:center;animation:ftw 1.8s ease-in-out infinite}
.frm .tw:nth-of-type(2n){animation-delay:.6s}
.frm .hal{transform-origin:0 0;animation:fhal 2.4s ease-in-out infinite}
}
@keyframes frot{to{transform:rotate(360deg)}}
@keyframes ftw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fhal{0%,100%{opacity:.45;transform:scale(.97)}50%{opacity:.95;transform:scale(1.04)}}
.lgrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px}.lgrow.cur{border-color:var(--accent);background:var(--accent-soft)}
.crown{position:absolute;right:-7px;top:-9px;font-size:1rem;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.av.svgav{padding:0;overflow:hidden;background:none}.av.svgav svg{width:100%;height:100%;display:block}
.avgrid button svg{width:100%;height:100%;display:block;border-radius:8px}
.avgrid button{height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.1rem;padding:2px;overflow:hidden}
.avgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.frp{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.frp[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}.frp[disabled]{opacity:.55}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:.75rem;line-height:1.25}
.bdg .e{font-size:1.7rem;line-height:0}.bdg .bic{width:56px;height:56px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}.bdg.off{opacity:.45;filter:grayscale(1)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:60}
.sheet{background:var(--surface);color:var(--ink);width:min(480px,100%);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp div{background:var(--surface2);border-radius:10px;padding:8px;text-align:center}.kp b{display:block;font-family:var(--font-display);font-size:1.15rem}.kp span{font-size:.7rem;color:var(--muted)}
.gap{text-align:center;color:var(--muted);letter-spacing:.3em;line-height:1;margin:-2px 0}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.nameinp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
@media (max-width:420px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.kpis{gap:8px}.kpi{padding:10px}}
@media (prefers-reduced-motion: no-preference){.bar>i,.days i{transition:width .4s ease,height .4s ease}.opt{transition:border-color .15s,background .15s}}

  const x=S.days[t0];if(x){D.A=x.a||0;D.C=x.c||0;D.pts=x.p||0}
  Object.keys(S.days).forEach(k=>{if(k>=wk){const y=S.days[k];W.A+=y.a||0;W.C+=y.c||0;W.pts+=y.p||0}});
  let A=0,C=0;Object.keys(S.lv).forEach(l=>{C+=S.lv[l][0];A+=S.lv[l][0]+S.lv[l][1]});
  return{D,W,T:{A,C,pts:Math.max(0,S.tp||0)}};
}

    const rev=opts&&opts.reverse!==undefined?opts.reverse:Math.random()<REVERSE_RATE;
    if(rev){
      const rd=pickDistractors(t,r=>r.word,r=>r.tr&&!trOverlap(t.tr,r.tr)&&!related(t,r));
      if(rd.length===3)return{question:'"'+t.tr+'" karşılığı hangi İngilizce kelime/ifadedir?',correct:t.word,distractors:rd};
    }
    q='"'+t.word+'" kelimesinin Türkçe karşılığı hangisidir?';correct=t.tr;
    d=pickDistractors(t,r=>r.tr,r=>r.tr&&!trOverlap(t.tr,r.tr)&&!related(t,r));
  }else if(k===1){
    q='"'+t.word+'" kelimesinin İngilizce tanımı hangisidir?';correct=t.def;
    d=pickDistractors(t,r=>r.def,r=>r.def&&r.def.toLowerCase()!==t.def.toLowerCase()&&!similarText(t.def,r.def)&&!related(t,r));
  }else if(k===3){
    const c=cloze(t);if(!c)return null;
    q='Boşluğa hangi kelime/ifade gelmeli?\n"'+c+'"';correct=t.word;
    if(closedClass(t)==='ortho')d=orthoDistractors(t.word);
    else d=pickDistractors(t,r=>r.word,r=>!related(t,r)&&closedClass(r)!=='ortho'&&!(posKey(r)==='number'));
  }else if(k===4){
    if(!has(t.syn))return null;
    q='"'+t.word+'" kelimesinin eş anlamlısı hangisidir?';correct=t.syn;
    const ts=toks(t.syn).concat([t.word.toLowerCase()]);
    d=pickDistractors(t,r=>r.syn,r=>has(r.syn)&&r.syn.toLowerCase()!==t.syn.toLowerCase()&&r.syn.toLowerCase()!==t.ant.toLowerCase()&&!toks(r.syn).some(x=>ts.indexOf(x)!==-1)&&!related(t,r));
  }else if(k===5){
    if(!has(t.ant))return null;
    q='"'+t.word+'" kelimesinin zıt anlamlısı hangisidir?';correct=t.ant;
    const ta=toks(t.ant).concat(toks(t.syn));
    d=pickDistractors(t,r=>r.ant,r=>has(r.ant)&&r.ant.toLowerCase()!==t.ant.toLowerCase()&&r.ant.toLowerCase()!==t.syn.toLowerCase()&&!toks(r.ant).some(x=>ta.indexOf(x)!==-1)&&!toks(r.syn).some(x=>toks(t.ant).indexOf(x)!==-1)&&!related(t,r));
  }else if(k===6){return verbQuestion(t)}
  else if(k===7)return proverbQ(t);
  else if(k===8)return missingQ(t);
  else if(k===9)return prepQ(t);
  else if(k===10)return affixQ(t);
  else if(k===11)return phraseDefQ(t);
  else return null;
  if(!correct||!d||d.length<3)return null;
  return{question:q,correct,distractors:d};
}

/* ---------- test akışı ---------- */
function dueWrong(all){
  const t=today();
  return Object.keys(S.wrong).filter(k=>BYWORD.has(k)&&(all||S.wrong[k].due<=t));
}
function makeItem(w,f,kind){
  const b=buildQuestion(w,f);
  if(!b)return null;
  return{w,f,kind,question:b.question,correct:b.correct,options:shuffle([b.correct].concat(b.distractors)),chosen:null};
}
const typeOK=w=>!S.set.type||S.set.type==='Hepsi'||posGroup(w)===S.set.type;
function newItems(n,level,skip){
  const pool=shuffle(W.filter(w=>!S.learned[w.word]&&(level==='Hepsi'||w.level===level)&&typeOK(w)&&!skip.has(w.word)));
  const out=[];
  for(const w of pool){
    if(out.length>=n)break;
    const done=S.prog[w.word]||[];
    let feats=applicable(w).filter(f=>done.indexOf(f)===-1);
    if(!feats.length)feats=applicable(w);
    for(const f of shuffle(feats)){const it=makeItem(w,f,'new');if(it){out.push(it);break}}
  }
  return out;
}
function reviewItems(n,all){
  const out=[];
  for(const k of shuffle(dueWrong(all))){
    if(out.length>=n)break;
    const w=BYWORD.get(k),e=S.wrong[k];
    const order=[0,1].sort((a,b)=>e.t[a]-e.t[b]).filter(f=>e.t[f]<STREAK_GOAL);
    for(const f of order){const it=makeItem(w,f,'review');if(it){out.push(it);break}}
  }
  return out;
}
function wlogAdd(it,ua){
  const w=it.w,k=w.word+'|'+it.f,L=S.wlog||(S.wlog=[]);
  let e=L.find(x=>x.k===k);
  if(e){e.n++;e.d=today();e.q=it.question;e.ca=it.correct;e.ua=ua}
  else{L.push({k,w:w.word,f:it.f,q:it.question,ca:it.correct,ua,d:today(),n:1});if(L.length>600)L.shift()}
}
function wlogDel(k){S.wlog=(S.wlog||[]).filter(x=>x.k!==k)}
function wlogItems(n){
  const out=[];
  for(const e of shuffle(S.wlog||[])){
    if(out.length>=n)break;
    const w=BYWORD.get(e.w);if(!w)continue;
    const it=makeItem(w,e.f,'wlog');if(it){it.lk=e.k;out.push(it)}
  }
  return out;
}
function startQuiz(mode,all){
  const n=S.set.count;
  let items=[];
  if(mode==='wlog'){items=wlogItems(all?9999:n)}
  else if(mode==='review'){items=reviewItems(n,all)}
  else if(mode==='today'){
    const rv=reviewItems(Math.ceil(n/3),false);
    const skip=new Set(rv.map(i=>i.w.word));
    items=rv.concat(newItems(n-rv.length,S.set.level,skip));
  }else items=newItems(n,S.set.level,new Set());
  items=shuffle(items);
  if(!items.length){toast(mode==='wlog'?'Yanlış defterin boş.':mode==='review'?'Tekrar edilecek kelime yok.':'Bu seviyede soru üretilecek kelime kalmadı.');return}
  UI.quiz={mode,items,i:0,right:0,wrong:[],learnedNow:[],pts:{c:0,b:0,w:0},done:false};
  UI.tab='quiz';render();
}
function answer(idx){
  const qz=UI.quiz,it=qz.items[qz.i];
  if(it.chosen!==null)return;
  it.chosen=idx;
  const ok=it.options[idx]===it.correct;
  it.ok=ok;
  if(ok){S.run=(S.run||0)+1;if(S.run>(S.br||0))S.br=S.run}else S.run=0;
  const w=it.w,d=dayStat();
  d.a++;if(ok)d.c++;
  const lv=S.lv[w.level]||(S.lv[w.level]=[0,0]);
  lv[ok?0:1]++;
  const dl=d.l||(d.l={});const dv=dl[w.level]||(dl[w.level]=[0,0]);dv[0]++;if(ok)dv[1]++;
  const cf=COEF[w.level]||1,bq=cf*(TYPEC[it.f]||1);
  let pt=0;
  if(ok){pt+=addPts(bq,'c');const G=Math.max(GOAL_MIN,S.set.goal||GOAL_MIN);if(d.c===G)pt+=addPts(10+Math.min(streak(),10),'b')}
  else if((S.tp||0)>=450)pt+=addPts(-0.25*bq,'w');
  if(ok){if(it.kind==='wlog')wlogDel(it.lk||(w.word+'|'+it.f))}else wlogAdd(it,it.options[idx]);
  const bw=S.wrong[w.word];
  if(ok){
    qz.right++;
    if(it.kind==='new'){
      const p=S.prog[w.word]||(S.prog[w.word]=[]);
      if(p.indexOf(it.f)===-1)p.push(it.f);
      if(applicable(w).every(f=>p.indexOf(f)!==-1)){
        S.learned[w.word]={d:today(),l:w.level};delete S.prog[w.word];qz.learnedNow.push(w.word);d.n++;pt+=addPts(3*cf,'b');
      }
    }
    if(bw&&(it.f===0||it.f===1)){
      bw.t[it.f]=Math.min(STREAK_GOAL,bw.t[it.f]+1);
      if(bw.t[0]>=STREAK_GOAL&&bw.t[1]>=STREAK_GOAL){delete S.wrong[w.word];it.cleared=true;pt+=addPts(2,'b')}
      else bw.due=addDays(today(),INTERVALS[Math.min(bw.t[it.f],INTERVALS.length)-1]||INTERVALS[INTERVALS.length-1]);
    }
  }else{
    qz.wrong.push(it);
    if(it.f===0||it.f===1){
      const e=S.wrong[w.word]||(S.wrong[w.word]={t:[0,0],due:today()});
      e.t[it.f]=0;e.due=today();
    }
  }
  it.pt=pt;
  save();render();
}

    ${!CLOUD.lbReady?'<div class="empty">Tablo yükleniyor…</div>':top.length?top.map(row).join('')+mine:`<div class="empty card">Bu tabloda henüz kimse yok. İlk puanı alan sıraya girer.</div>${mine}`}
    <details class="card small"><summary style="cursor:pointer;font-weight:600">Puan nasıl hesaplanır?</summary>
      <div class="stack" style="margin-top:10px">

      <div><b>Bonuslar:</b> yeni kelimeyi öğrenmek +3 × seviye katsayısı, tekrar listesinden bir kelimeyi çıkarmak +2, günlük hedefi tamamlamak +10 ve seri bonusu (en fazla +10).</div>
      <div><b>Altın ve üstü liglerde</b> yanlış cevap, doğru cevap puanının dörtte biri kadar puan düşürür. Günlük puan sıfırın altına inmez.</div>

    ${!CLOUD.write?'<div class="card small muted">Bu bağlantıyla yalnızca görüntüleyebilirsin. Sıraya girmek için sahibinden "Katkıda bulunan" izni iste.</div>':''}
    ${S.prof.name&&!S.prof.show?'<div class="card small muted">Profilin gizli, tabloda görünmüyorsun. Profil sekmesinden açabilirsin.</div>':''}
    ${CLOUD.lbErr?'<div class="card small muted">Tablo şu an okunamıyor. Biraz sonra yeniden dene.</div>':''}`;
  }
  return`<div class="top"><h1>Sıralama</h1></div><div class="stack">${body}</div>`;
}

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
let VOICES=[];
try{const lv=()=>{VOICES=speechSynthesis.getVoices()};lv();speechSynthesis.addEventListener('voiceschanged',lv)}catch(e){}
function say(word,pron){
  try{
    const clean=String(word).replace(/\s*\([^)]*\)/g,'').split('/')[0];
    VOICES=speechSynthesis.getVoices()||VOICES;
    const us=VOICES.filter(v=>/^en[-_]US$/i.test(v.lang));
    const en=us.length?us:VOICES.filter(v=>/^en([-_]|$)/i.test(v.lang));
    const pick=en.find(x=>/google|samantha|aaron|alex|jenny|aria|natural/i.test(x.name))||en[0];
    let u;
    if(pick){
      u=new SpeechSynthesisUtterance(clean);u.voice=pick;u.lang=pick.lang||'en-US';u.rate=.9;
    }else if(pron){
      // İngilizce ses yoksa Türkçe okunuşu Türkçe sesle seslendir (fever -> fi-vır)
      u=new SpeechSynthesisUtterance(String(pron).replace(/-/g,'').toLowerCase());u.lang='tr-TR';u.rate=.85;
      toast('Bu cihazda İngilizce ses yok, Türkçe okunuş okunuyor.');
    }else{
      u=new SpeechSynthesisUtterance(clean);u.lang='en-US';u.rate=.9;
    }
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast('Bu cihazda sesli okuma yok.')}
}

const CHAT={pub:[],dm:[],tmp:[],ready:false,err:'',busy:false,dmFull:0,sending:false,nk:''};
UI.chat={view:'pub',peer:null,draft:'',q:''};
function chatSeen(){try{return JSON.parse(localStorage.getItem('kd-chat-'+CLOUD.uid)||'{}')}catch(e){return{}}}
function chatMark(k,id){try{const s=chatSeen();if((s[k]||0)<id){s[k]=id;localStorage.setItem('kd-chat-'+CLOUD.uid,JSON.stringify(s))}}catch(e){}}
function chatUnread(peer){
  if(!CLOUD.uid)return 0;
  const s=chatSeen();let n=0;
  CHAT.dm.forEach(m=>{if(m.to_user===CLOUD.uid&&(!peer||m.user_id===peer)&&m.id>(s['u'+m.user_id]||0)&&!(UI.tab==='chat'&&UI.chat.view==='dm'&&UI.chat.peer===m.user_id))n++});
  return n;
}
function chatPeer(id){
  const r=CLOUD.lb.find(x=>x.id===id);
  if(r)return r;
  if(id===CLOUD.uid)return{id,name:S.prof.name||CLOUD.defName,un:CLOUD.username,color:S.prof.color,av:S.prof.av,fr:S.prof.frame};
  const m=CHAT.dm.find(x=>x.user_id===id);
  return{id,name:m?m.sname:'Kullanıcı',color:0,av:0,fr:''};
}
const CHCOLS='id,user_id,to_user,sname,body,created_at';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function chatFetchDm(after){
  const out=[];let last=after||0;
  for(let k=0;k<50;k++){
    const r=await sb.from('chat_messages').select(CHCOLS).not('to_user','is',null).gt('id',last).order('id',{ascending:true}).limit(1000);
    if(r.error)throw r.error;
    const d=r.data||[];out.push(...d);
    if(d.length<1000)break;
    last=d[d.length-1].id;
  }
  return out;
}
async function chatLoad(wait){
  if(!sb||!CLOUD.uid||CLOUD.approved===false||!navigator.onLine)return;
  if(CHAT.busy){if(!wait)return;while(CHAT.busy)await sleep(60)}
  CHAT.busy=true;
  try{
    const a=await sb.from('chat_messages').select(CHCOLS).is('to_user',null).order('id',{ascending:false}).limit(80);
    if(a.error)throw a.error;
    CHAT.pub=(a.data||[]).slice().reverse();
    const now=Date.now();
    if(!CHAT.ready||now-(CHAT.dmFull||0)>300000){CHAT.dm=await chatFetchDm(0);CHAT.dmFull=now}
    else{const add=await chatFetchDm(CHAT.dm.length?CHAT.dm[CHAT.dm.length-1].id:0);if(add.length)CHAT.dm=CHAT.dm.concat(add)}
    CHAT.ready=true;CHAT.err='';
  }catch(e){CHAT.err=String(e&&e.message||e).indexOf('chat_messages')>-1?'setup':'err'}
  CHAT.busy=false;
  if(UI.tab==='chat')chatPaint();else renderNavOnly();
}
function renderNavOnly(){if(CLOUD.uid&&CLOUD.approved!==false)renderNav()}
function chatMsgs(){
  const C=UI.chat,tmp=(CHAT.tmp||[]);
  if(C.view==='pub')return CHAT.pub.concat(tmp.filter(m=>!m.to_user));
  return CHAT.dm.concat(tmp.filter(m=>m.to_user)).filter(m=>m.user_id===C.peer||m.to_user===C.peer);
}
function chatMsgHtml(m,prev){
  const me=m.user_id===CLOUD.uid,d=new Date(m.created_at),day=d.toLocaleDateString('sv-SE'),id=m.user_id;
  const pd=prev?new Date(prev.created_at).toLocaleDateString('sv-SE'):'';
  const sep=day!==pd?`<div class="cdt">${day===today()?'Bugün':fmt(day)}</div>`:'';
  const tm=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  const can=me||(CLOUD.admin&&!m.to_user);
  const adm=isAdm(id),g=adm?'admin':(leagueMap()[id]|0),th=adm||g>=6;
  let hd='';
  if(UI.chat.view==='pub'){const r=chatPeer(id),un=r.un||(me?CLOUD.username:'');hd=`<div class="cn row" data-pc="${esc(id)}" style="gap:6px">${avatar(r.name||m.sname,r.color,false,r.av,'')}<span>${esc(m.sname||r.name||'Kullanıcı')}${un?` <span class="cu">@${esc(un)}</span>`:''}</span></div>`}
  return sep+`<div class="cm ${me?'me':''}" ${th?`data-lg="${g}"`:''}>${hd}<div class="cb">${esc(m.body)}</div><div class="ct"><span>${tm}</span>${can?`<button data-act="chat-del" data-id="${m.id}" aria-label="Sil">sil</button>`:''}</div></div>`;
}
function chatPaint(){
  const el=document.getElementById('chatlist');
  if(!el){if(UI.tab==='chat'&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))render();return}
  const ms=chatMsgs(),C=UI.chat;
  let near;
  if(!el.dataset.init){near=C.nb!==false}else near=el.scrollHeight-el.scrollTop-el.clientHeight<90;
  const want=new Set(ms.map(m=>String(m.id)));
  Array.from(el.children).forEach(c=>{if(!c.dataset.mid||!want.has(c.dataset.mid))c.remove()});
  let cur=el.firstElementChild,changed=false;
  ms.forEach((m,i)=>{
    const id=String(m.id);
    if(cur&&cur.dataset.mid===id){cur=cur.nextElementSibling;return}
    const w=document.createElement('div');w.dataset.mid=id;w.style.display='contents';w.innerHTML=chatMsgHtml(m,ms[i-1]);
    el.insertBefore(w,cur);changed=true;
  });
  if(!ms.length&&!el.querySelector('.empty'))el.innerHTML='<div class="empty">Henüz mesaj yok. İlk mesajı sen yaz.</div>';
  if(!el.dataset.init){el.dataset.init='1';if(near||C.st==null)el.scrollTop=el.scrollHeight;else el.scrollTop=C.st}
  else if(changed&&near)el.scrollTop=el.scrollHeight;
  const last=ms.filter(m=>m.id>0).reduce((a,m)=>Math.max(a,m.id),0);
  if(C.view==='pub')chatMark('pub',last);else if(C.peer)ms.forEach(m=>{if(m.user_id===C.peer&&m.id>0)chatMark('u'+m.user_id,m.id)});
  const nk=chatUnread()+'|'+(UI.tab);if(CHAT.nk!==nk){CHAT.nk=nk;renderNavOnly()}
}
function vChat(){
  const C=UI.chat;
  if(CHAT.err==='setup')return`<div class="top"><h1>Sohbet</h1></div><div class="card">Sohbet henüz kurulmadı. Yönetici, <b>supabase-chat.sql</b> dosyasını Supabase SQL Editor'da bir kez çalıştırmalı.</div>`;

    const th={};

    const list=Object.keys(th).sort((a,b)=>th[b].id-th[a].id);

    const found=q?CLOUD.lb.filter(r=>r.id!==CLOUD.uid&&r.name&&r.name.toLowerCase().includes(q)).slice(0,12):[];
    const row=(id,sub,n)=>{const r=chatPeer(id);return`<div class="rk" data-act="chat-open" data-v="${esc(id)}" style="grid-template-columns:54px 1fr auto">${avatar(r.name,r.color,false,r.av,frameFor(id,r.fr))}<div class="nm">${esc(r.name)}<div class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sub)}</div></div>${n?`<span class="badge">${n}</span>`:''}</div>`};
    body=`<input id="chq" class="nameinp" type="search" placeholder="Yeni mesaj için kullanıcı ara" value="${esc(C.q||'')}" autocomplete="off">`+
      (q?(found.length?found.map(r=>row(r.id,'Mesaj yaz',0)).join(''):'<div class="empty">Kullanıcı bulunamadı.</div>'):
        (list.length?list.map(id=>row(id,(th[id].user_id===CLOUD.uid?'Sen: ':'')+th[id].body,chatUnread(id))).join(''):'<div class="empty">Henüz özel mesajın yok. Yukarıdan birini ara ya da Sıra ekranında bir profile dokunup "Mesaj gönder"i seç.</div>'));
  }else{
    const hd=C.view==='dm'?(()=>{const r=chatPeer(C.peer);return`<div class="row" style="gap:10px"><button class="chip" data-act="chat-back">‹ Geri</button><span class="row" data-pc="${esc(C.peer)}" style="gap:10px;cursor:pointer">${avatar(r.name,r.color,false,r.av,frameFor(C.peer,r.fr))}<b>${esc(r.name)}</b></span></div>`})():'';
    body=hd+`<div class="chatlist" id="chatlist" role="log" aria-live="polite">${CHAT.ready?'':'<div class="empty">Yükleniyor…</div>'}</div>
    <div class="cfm"><input id="chin" class="nameinp" maxlength="500" placeholder="${C.view==='pub'?'Herkese yaz…':'Mesaj yaz…'}" value="${esc(C.draft)}" autocomplete="off" enterkeyhint="send"><button class="btn primary" data-act="chat-send">Gönder</button></div>`;
  }
  return`<div class="top"><h1>Sohbet</h1></div><div class="stack">${seg}${body}</div>`;
}
async function chatSend(){
  const inp=document.getElementById('chin'),C=UI.chat;
  const v=((inp&&inp.value)||C.draft||'').trim();
  if(!v||!sb||!CLOUD.uid||CHAT.sending)return;
  if(C.view==='dm'&&!C.peer)return;
  const dm=C.view==='dm';
  if(!dm){
    const cut=Date.now()-60000;
    const recent=CHAT.pub.filter(m=>m.user_id===CLOUD.uid&&new Date(m.created_at).getTime()>cut).length+(CHAT.tmp||[]).filter(m=>!m.to_user).length;
    if(recent>=5){toast('Genel sohbette dakikada en fazla 5 mesaj yazabilirsin.');return}
  }
  CHAT.sending=true;
  const tmp={id:-Date.now(),user_id:CLOUD.uid,to_user:dm?C.peer:null,sname:S.prof.name||CLOUD.defName,body:v.slice(0,500),created_at:new Date().toISOString()};
  (CHAT.tmp=CHAT.tmp||[]).push(tmp);
  C.draft='';if(inp){inp.value='';}
  C.nb=true;chatPaint();const el0=document.getElementById('chatlist');if(el0)el0.scrollTop=el0.scrollHeight;
  const r=await sb.from('chat_messages').insert({user_id:CLOUD.uid,to_user:tmp.to_user,body:tmp.body});
  if(r.error){
    CHAT.tmp=CHAT.tmp.filter(x=>x!==tmp);
    toast(/row-level|policy|violat/i.test(r.error.message||'')?(dm?'Mesaj gönderilemedi.':'Çok hızlı yazıyorsun ya da mesaj gönderme iznin yok.'):'Mesaj gönderilemedi.');
    if(!C.draft){C.draft=v;const i2=document.getElementById('chin');if(i2)i2.value=v}
    chatPaint();CHAT.sending=false;return;
  }
  await chatLoad(true);
  CHAT.tmp=CHAT.tmp.filter(x=>x!==tmp);
  chatPaint();
  const el=document.getElementById('chatlist');if(el)el.scrollTop=el.scrollHeight;
  CHAT.sending=false;
}

    case'notif':toggleNotif();break;
    case'recheck':{await checkAccess();if(CLOUD.approved!==false){await onLogin({id:CLOUD.uid,email:CLOUD.username+'@x'})}else{toast('Henüz onaylanmadı.');render()}break}
    case'fb-kind':{const el2=document.getElementById('fbq');if(el2)UI.fb.draft=el2.value;UI.fb.kind=g('data-v');render();break}
    case'fb-send':sendFb();break;
    case'afb-filter':UI.afb.filter=g('data-v');render();break;
    case'afb-load':loadAdminFb();break;
    case'afb-reply':afbAct('reply',g('data-u'));break;
    case'afb-read':afbAct('read',g('data-u'));break;
    case'afb-done':afbAct('done',g('data-u'));break;
    case'afb-del':UI.afb.del=g('data-u');render();break;
    case'afb-del-no':UI.afb.del=null;render();break;
    case'afb-del-yes':afbAct('del',g('data-u'));break;
    case'card-close':UI.card=null;render();break;
    case'noop':break;
    case'adm-load':loadUsers();break;
    case'adm-approve':admAct('approve',g('data-u'));break;
    case'adm-revoke':admAct('revoke',g('data-u'));break;
    case'adm-del':UI.adm.confirm=g('data-u');UI.adm.rs=null;render();break;
    case'adm-del-no':UI.adm.confirm=null;render();break;
    case'adm-del-yes':admAct('delete',g('data-u'));break;
    case'adm-approve-all':admAct('approve-all',null,UI.adm.list.filter(u=>!u.approved&&!u.is_admin).map(u=>u.user_id));break;
    case'adm-pw':admAct('reset-pw',g('data-u'));break;
    case'adm-pw-copy':try{navigator.clipboard.writeText(UI.adm.pw.pw).then(()=>toast('Kopyalandı.'),()=>{})}catch(e){}break;
    case'adm-pw-close':UI.adm.pw=null;render();break;
    case'adm-block':admAct('block',g('data-u'));break;
    case'adm-unblock':admAct('unblock',g('data-u'));break;
    case'adm-rs':UI.adm.rs=g('data-u');UI.adm.confirm=null;render();break;
    case'adm-rs-no':UI.adm.rs=null;render();break;
    case'adm-rs-yes':admAct('reset-progress',g('data-u'));break;
    case'ann-save':saveAnn(false);break;
    case'ann-clear':saveAnn(true);break;
    case'ann-toggle':UI.annOpen=!UI.annOpen;render();break;
    case'auth-mode':UI.auth.mode=g('data-v');UI.auth.msg='';render();break;
    case'auth-submit':doAuth();break;
    case'logout':{clearTimeout(pushT);if(sb&&navigator.onLine){try{await pushNow()}catch(e){}}try{await sb.auth.signOut()}catch(e){}onLogout();break}
    case'chpw':{const v=(document.getElementById('newpw')||{}).value||'';if(v.length<6){toast('Şifre en az 6 karakter olmalı.');break}
      try{const r=await sb.auth.updateUser({password:v});if(r.error)throw r.error;document.getElementById('newpw').value='';toast('Şifre değiştirildi.')}catch(e){toast('Şifre değiştirilemedi.')}break}
    case'install':{if(window.__bip){window.__bip.prompt();window.__bip=null;render()}break}
    case'save-prof':{
      syncDraft();const d=UI.draft,nm=d.name.replace(/[\u0000-\u001f]/g,'').trim().slice(0,24);
      if(nm.length<2){toast('Ad en az 2 karakter olmalı.');break}
      S.prof={name:nm,color:d.color,show:d.show,av:d.av|0,frame:(LGIDX.has(d.frame)&&LGIDX.get(d.frame)>myLeague())?'auto':normFrame(d.frame)};UI.draft=null;save();CLOUD.last='';pushNow();render();toast('Profil kaydedildi.');break}
    case'export':{UI.backup=JSON.stringify(S);render();try{navigator.clipboard.writeText(UI.backup).then(()=>toast('Yedek panoya kopyalandı.'),()=>{})}catch(e){}break}
    case'import':importBackup();break;
    case'reset':UI.confirmReset=true;render();break;
    case'reset-no':UI.confirmReset=false;render();break;
    case'reset-yes':{const set=S.set,prof=S.prof;S=fresh();S.set=set;S.prof=prof;save();UI.confirmReset=false;render();toast('İlerleme sıfırlandı.');break}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='fbq'){UI.fb.draft=e.target.value;return}
  if(e.target.id==='chin'){UI.chat.draft=e.target.value;return}
  if(e.target.id==='chq'){UI.chat.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('chq');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(e.target.dataset&&e.target.dataset.fid){UI.afb.reply[e.target.dataset.fid]=e.target.value;return}
  if(e.target.id==='annq'){UI.adm.annDraft=e.target.value;return}
  if(e.target.id==='adq'){UI.adm.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('adq');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(e.target.id==='q'){UI.dict.q=e.target.value;UI.dict.limit=40;UI.dict.open=null;$('#dlist').innerHTML=dictList()}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='posf'){UI.dict.pos=e.target.value;UI.dict.limit=40;render()}
  else if(id==='goal'){S.set.goal=+e.target.value;save();toast('Hedef güncellendi.')}
  else if(id==='hour'){S.set.hour=+e.target.value;save()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.card){UI.card=null;render();return}
  if(e.key==='Enter'&&e.target.id==='chin'){e.preventDefault();chatSend();return}
  if(e.key==='Enter'&&!CLOUD.uid&&/^au-/.test(e.target.id||'')){e.preventDefault();doAuth();return}
  if(UI.tab!=='quiz'||!UI.quiz||UI.quiz.done)return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const it=UI.quiz.items[UI.quiz.i];
  if(e.key>='1'&&e.key<='4'&&it.chosen===null){answer(+e.key-1)}
  else if((e.key==='Enter'||e.key===' ')&&it.chosen!==null){e.preventDefault();next()}
});
function syncDraft(){
  UI.focusName=document.activeElement&&document.activeElement.id==='pname';
  if(!UI.draft)UI.draft=newDraft();
  const n=document.getElementById('pname'),s=document.getElementById('pshow');
  if(n)UI.draft.name=n.value;if(s)UI.draft.show=s.checked;
}
function importBackup(){
  const v=($('#bk')||{}).value||'';
  try{
    const p=JSON.parse(v);
    if(!p||typeof p!=='object'||!p.learned||!p.prog)throw 0;
    S=Object.assign(fresh(),p);S.set=Object.assign(fresh().set,p.set||{});S.prof=Object.assign(fresh().prof,p.prof||{});save();render();toast('Yedek yüklendi.');
  }catch(e){toast('Yedek metni geçersiz.')}
}
function toggleNotif(){
  if(S.set.notif){S.set.notif=false;save();render();return}
  if(!('Notification' in window)){toast('Bu tarayıcı bildirimleri desteklemiyor.');return}
  try{
    Notification.requestPermission().then(p=>{
      if(p==='granted'){S.set.notif=true;save();render();toast('Hatırlatma açıldı.')}
      else toast('Bildirim izni verilmedi.');
    }).catch(()=>toast('Bildirim izni alınamadı.'));
  }catch(e){toast('Bildirim izni alınamadı.')}
}
function maybeNotify(){
  try{
    if(!S.set.notif||!('Notification' in window)||Notification.permission!=='granted')return;
    if(new Date().getHours()<S.set.hour||S.lastNotif===today())return;
    const left=S.set.goal-dayStat().c;if(left<=0)return;
    new Notification('Kelime Defteri',{body:`Bugünkü hedefe ${left} doğru cevap kaldı.`});
    S.lastNotif=today();save();
  }catch(e){}
}
setInterval(maybeNotify,60000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(pushT);pushNow()}else{if(CLOUD.uid&&CLOUD.approved!==false&&applyDecay()>0)persistLocal();maybeNotify();if(UI.tab==='today')render()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e;if(UI.tab==='me'&&UI.me==='set')render()});
window.addEventListener('online',()=>{schedulePush();refreshBoard()});
setInterval(()=>{if(!document.hidden&&(UI.tab==='rank'||UI.tab==='today'))refreshBoard()},60000);
setInterval(()=>{if(document.hidden||!CLOUD.uid||CLOUD.approved===false||!navigator.onLine)return;loadMyFb();if(CLOUD.admin)loadAdminFb()},120000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
render();maybeNotify();initAuth();
})();
</script>
</body>
</html>
