/* Layout: tek sütunlu, telefon öncelikli kabuk; altta sekme çubuğu, üstte sayfa başlığı, içerik 720px ile sınırlı. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --surface2:#eaeef7; --ink:#141f3a; --muted:#56627f; --line:#d9dfec;
  --accent:#2b4eff; --accent-ink:#ffffff; --accent-soft:#e3e9ff;
  --ok:#0f7a58; --ok-bg:#dff4ea; --bad:#be2c47; --bad-bg:#fde6ea; --warn:#9a6a00; --warn-bg:#fff1cf;
  --l-A1:#3a9d7c; --l-A2:#2f9aa3; --l-B1:#3c86c4; --l-B2:#3b62d6; --l-C1:#6050cc; --l-C2:#8e3cb4;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1325; --surface:#151d33; --surface2:#1d2742; --ink:#e7ebf8; --muted:#9ba8c8; --line:#27324f;
  --accent:#7f95ff; --accent-ink:#0d1325; --accent-soft:#222d57;
  --ok:#4fd0a0; --ok-bg:#103228; --bad:#ff8097; --bad-bg:#3a1829; --warn:#f0be52; --warn-bg:#392d12;
  --l-A1:#5fcfa6; --l-A2:#55cdd6; --l-B1:#6aaee6; --l-B2:#7f9bff; --l-C1:#9a8cff; --l-C2:#c78af0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1325; --surface:#151d33; --surface2:#1d2742; --ink:#e7ebf8; --muted:#9ba8c8; --line:#27324f;
  --accent:#7f95ff; --accent-ink:#0d1325; --accent-soft:#222d57;
  --ok:#4fd0a0; --ok-bg:#103228; --bad:#ff8097; --bad-bg:#3a1829; --warn:#f0be52; --warn-bg:#392d12;
  --l-A1:#5fcfa6; --l-A2:#55cdd6; --l-B1:#6aaee6; --l-B2:#7f9bff; --l-C1:#9a8cff; --l-C2:#c78af0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
#app{max-width:720px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 28px)}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.2rem}
h3{font-size:1rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--font-mono);font-size:.9em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.88rem;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lv{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.78rem;font-weight:500;border:1px solid currentColor;border-radius:6px;padding:1px 7px}
.lv-A1{color:var(--l-A1)}.lv-A2{color:var(--l-A2)}.lv-B1{color:var(--l-B1)}.lv-B2{color:var(--l-B2)}.lv-C1{color:var(--l-C1)}.lv-C2{color:var(--l-C2)}
.badge{font-size:.75rem;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface2);color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;
  padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:1px}
nav button{position:relative;border:0;background:none;border-radius:10px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;padding:0;font-weight:600;color:var(--muted)}
.pbar{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.pbar .pn{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}.pbar .pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pbar .pr{display:flex;gap:6px}
/* Lig ve yönetici satır temaları */
.rk[data-lg],.pbar[data-lg]{position:relative;overflow:hidden;--lc:var(--line);border-color:var(--lc)}
[data-lg="1"]{--lc:#b87333;background:linear-gradient(100deg,rgba(184,115,51,.14),transparent 70%),var(--surface)!important}
[data-lg="2"]{--lc:#9aa4b2;background:linear-gradient(100deg,rgba(154,164,178,.22),transparent 70%),var(--surface)!important}
[data-lg="3"]{--lc:#d4a017;background:linear-gradient(100deg,rgba(212,160,23,.22),rgba(212,160,23,.04)),var(--surface)!important;box-shadow:0 0 8px rgba(212,160,23,.25)}
[data-lg="4"]{--lc:#3fb6c9;background:linear-gradient(100deg,rgba(63,182,201,.24),rgba(190,230,240,.08)),var(--surface)!important;box-shadow:0 0 10px rgba(63,182,201,.3)}
[data-lg="5"]{--lc:#12b981;background:linear-gradient(100deg,rgba(18,185,129,.28),rgba(18,185,129,.05)),var(--surface)!important;box-shadow:0 0 12px rgba(18,185,129,.38)}
[data-lg="6"]{--lc:#38bdf8;background:linear-gradient(100deg,rgba(56,189,248,.3),rgba(167,139,250,.12)),var(--surface)!important;box-shadow:0 0 14px rgba(56,189,248,.45)}
[data-lg="7"]{--lc:#a855f7;background:linear-gradient(100deg,rgba(168,85,247,.32),rgba(236,72,153,.1)),var(--surface)!important;box-shadow:0 0 16px rgba(168,85,247,.5)}
[data-lg="8"]{--lc:#f43f5e;background:linear-gradient(100deg,rgba(244,63,94,.32),rgba(249,115,22,.18)),var(--surface)!important;box-shadow:0 0 18px rgba(244,63,94,.55)}
[data-lg="9"]{--lc:#fbbf24;background:linear-gradient(100deg,rgba(251,191,36,.38),rgba(244,63,94,.18),rgba(168,85,247,.18)),var(--surface)!important;box-shadow:0 0 22px rgba(251,191,36,.65);border-width:2px}
[data-lg="6"]::after,[data-lg="7"]::after,[data-lg="8"]::after,[data-lg="9"]::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);animation:lgshine 4.5s ease-in-out infinite}
.rk[data-lg="admin"],.pbar[data-lg="admin"]{overflow:visible}
[data-lg="8"]::after{animation-duration:3.5s}[data-lg="9"]::after{animation-duration:2.6s}
@keyframes lgshine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
[data-lg="admin"]{--lc:#d4af37;background:linear-gradient(100deg,#000,#1b1608 60%,#000)!important;border:1.5px solid #d4af37;box-shadow:0 0 14px rgba(212,175,55,.45),inset 0 0 18px rgba(212,175,55,.08);color:#f6e7b0}
[data-lg="admin"] .nm,[data-lg="admin"] .pn b,[data-lg="admin"] .val{color:#f8e9b4}
[data-lg="admin"] .muted,[data-lg="admin"] .val small,[data-lg="admin"] .pos{color:#b9a463!important}
[data-lg="admin"] .badge{background:#2a2310;color:#e9cf7a}
@media (prefers-reduced-motion:reduce){[data-lg]::after{animation:none!important;display:none}}
[data-lg="0"]{--lc:#9ca3af;--ll:#e5e7eb;--ld:#4b5563;--rw:2px}
[data-lg="1"]{--lc:#cd7f32;--ll:#f3c89b;--ld:#8a4b14;--rw:2.5px}
[data-lg="2"]{--lc:#b8c0cc;--ll:#f8fafc;--ld:#6b7280;--rw:2.5px}
[data-lg="3"]{--lc:#e0a800;--ll:#fde68a;--ld:#8a6508;--rw:3px}
[data-lg="4"]{--lc:#3fb6c9;--ll:#d9f7fb;--ld:#1f7a8a;--rw:3px}
[data-lg="5"]{--lc:#12b981;--ll:#a7f3d0;--ld:#047857;--rw:3.5px}
[data-lg="6"]{--lc:#38bdf8;--ll:#e0f2fe;--ld:#1d6fb8;--rw:3.5px}
[data-lg="7"]{--lc:#a855f7;--ll:#f0d9ff;--ld:#6b21a8;--rw:4px}
[data-lg="8"]{--lc:#f43f5e;--ll:#ffd1b0;--ld:#9f1239;--rw:4px}
[data-lg="9"]{--lc:#fbbf24;--ll:#fff7c2;--ld:#b45309;--rw:4.5px}
[data-lg="admin"]{--ll:#f9e08a;--ld:#7a5a0c;--rw:3.5px}
.rk[data-lg]::before,.pbar[data-lg]::before,.cm[data-lg]::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--rw);pointer-events:none;z-index:1;
  background:repeating-linear-gradient(135deg,var(--ld) 0 2px,var(--ll) 2px 4px,var(--lc) 4px 6px,var(--ll) 6px 7px,var(--ld) 7px 9px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.cm[data-lg]{position:relative;overflow:hidden;--lc:var(--line)}
.cm[data-lg] .cn{color:var(--nc)}.cm .cu{font-weight:500;opacity:.8}
.cm[data-lg="admin"] .cn{color:#ff3b3b}.cm[data-lg="admin"] .cb{color:#f8e9b4}.cm[data-lg="admin"] .ct,.cm[data-lg="admin"] .ct button{color:#b9a463}
.rk[data-lg],.pbar[data-lg],.cm[data-lg],.sheet[data-lg]{--nc:color-mix(in srgb,var(--ld) 80%,var(--ink))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-lg]{--nc:var(--ll)}}
:root[data-theme="dark"] [data-lg]{--nc:var(--ll)}
.rk[data-lg],.pbar[data-lg]{border-color:transparent}
.rk[data-lg] .nm,.pbar[data-lg] .pn b{color:var(--nc)}
.sheet[data-lg]:not(.adm){--sg:color-mix(in srgb,var(--lc) 22%,var(--surface));background:linear-gradient(180deg,var(--sg),var(--surface) 55%);border-top:var(--rw,2px) solid transparent;border-image:repeating-linear-gradient(135deg,var(--ld) 0 2px,var(--ll) 2px 4px,var(--lc) 4px 6px,var(--ll) 6px 7px,var(--ld) 7px 9px) 6;box-shadow:0 -6px 28px color-mix(in srgb,var(--lc) 45%,transparent)}
.sheet[data-lg]:not(.adm) h2{color:var(--nc)}
.sheet[data-lg]:not(.adm) .kp div,.sheet[data-lg]:not(.adm) .bdg{background:color-mix(in srgb,var(--lc) 10%,var(--surface2));border-color:color-mix(in srgb,var(--lc) 35%,var(--line))}
/* Yönetici: sırma çerçeve, kırmızı isim, kanlı çerçeve, siyah kart */
[data-lg="admin"]::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:3.5px;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(135deg,#7a5a0c 0 2px,#f9e08a 2px 4px,#c79a1f 4px 6px,#fff3b8 6px 7px,#8a6510 7px 9px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.rk[data-lg="admin"].me,.pbar[data-lg="admin"],[data-lg="admin"]{box-shadow:0 0 14px rgba(212,175,55,.5),inset 0 0 18px rgba(212,175,55,.08)}
[data-lg="admin"] .nm,[data-lg="admin"] .pn b{color:#ff3b3b!important;text-shadow:0 0 8px rgba(255,0,0,.45)}
.sheet.adm{background:linear-gradient(180deg,#120d06,#000 40%);color:#f3e3b0;position:relative;border-top:4px solid transparent;border-image:repeating-linear-gradient(135deg,#7a5a0c 0 2px,#f9e08a 2px 4px,#c79a1f 4px 6px,#fff3b8 6px 7px,#8a6510 7px 9px) 4;box-shadow:0 -6px 30px rgba(212,175,55,.35)}
.sheet.adm .avw{margin:14px 16px 18px 10px}
.sheet.adm h2{color:#ff3b3b;text-shadow:0 0 10px rgba(255,0,0,.5)}
.sheet.adm .muted,.sheet.adm .kp span{color:#b9a463}
.sheet.adm .kp div,.sheet.adm .bdg{background:#17110a;border:1px solid #3d3012;color:#f3e3b0}
.sheet.adm .btn{background:#17110a;border-color:#8a6510;color:#f3e3b0}
.sheet.adm .badge{background:#2a2310;color:#e9cf7a}
.frm.bld .wob{animation:bwob 3.2s ease-in-out infinite;transform-origin:0 0}
.frm.bld .fl{transform-box:fill-box;transform-origin:50% 100%;animation:bfl .55s ease-in-out infinite alternate}
.frm.bld .fl.in{animation-duration:.4s}
.frm.bld .emb{animation:bemb 1.9s ease-in-out infinite}
.frm.bld .hg{transform-box:fill-box;transform-origin:50% 0;animation:bdrip 3.2s ease-in-out infinite}
.frm.bld .bd{transform-box:fill-box;transform-origin:50% 0;opacity:0;animation:bfall 3.4s cubic-bezier(.5,0,.9,.6) infinite}
@keyframes bwob{0%,100%{transform:rotate(-2.2deg) scale(1)}50%{transform:rotate(2.2deg) scale(1.015)}}
@keyframes bdrip{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3)}}
@keyframes bfl{from{transform:scale(.82,.9) skewX(-5deg)}to{transform:scale(1.08,1.22) skewX(5deg)}}
@keyframes bemb{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes bfall{0%{opacity:0;transform:translateY(0) scale(.2)}12%{opacity:1;transform:translateY(0) scale(1)}28%{opacity:1;transform:translateY(5px) scale(1.05,1.25)}100%{opacity:0;transform:translateY(330px) scale(.9,1.5)}}
@media (prefers-reduced-motion:reduce){.frm.bld .wob,.frm.bld .fl,.frm.bld .emb,.frm.bld .hg{animation:none}.frm.bld .bd{animation:none;opacity:0}}
.rk[data-lg="admin"],.pbar[data-lg="admin"],.cm[data-lg="admin"]{z-index:3}
nav .nbd{position:absolute;top:2px;right:6px;font-style:normal;background:var(--bad);color:#fff;border-radius:8px;padding:0 5px;font-size:.62rem}
.chatlist{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;height:calc(100vh - 330px);min-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.dhud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dside{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}.dside.r{flex-direction:row-reverse;text-align:right}
.dside b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.dside .mono{font-size:1.4rem;font-weight:800}
.dvs{font-weight:800;color:var(--muted);font-size:.9rem}
.dprog{display:flex;flex-direction:column;gap:4px;margin-top:8px}.dprog .bar{height:6px}.dprog .bar.opp>i{background:var(--bad)}
.bar.tm{height:12px}
.cm{flex:none;max-width:84%;align-self:flex-start;background:var(--surface2);border-radius:12px;padding:6px 10px;overflow-wrap:anywhere}
.cm.me{align-self:flex-end;background:var(--accent-soft)}
.cm .cn{font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer}
.cm .cb{white-space:pre-wrap;font-size:.92rem}
.cm .ct{font-size:.66rem;color:var(--muted);display:flex;gap:8px;justify-content:flex-end}
.cm .ct button{border:0;background:none;color:var(--muted);padding:0}
.cdt{flex:none;align-self:center;font-size:.68rem;color:var(--muted)}
.cfm{display:flex;gap:8px;margin-top:8px}.cfm input{flex:1}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
/* today */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1}
.ring .n small{display:block;font-family:var(--font-body);font-weight:500;font-size:.7rem;color:var(--muted);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi b{display:block;font-family:var(--font-display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.wotd .w{font-family:var(--font-display);font-size:1.7rem;font-weight:700}
/* bars */
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.lvrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.lvrow .num{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);text-align:right}
.days{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:6px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.days i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.days i.w{background:var(--bad);opacity:.8;border-radius:2px}
.days small{font-size:.66rem;color:var(--muted)}
/* dict */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:46px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.entry .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%;border:0;background:none;padding:0;text-align:left}
.entry .w{font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.entry .tr{color:var(--muted)}
.entry dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.entry dt{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}

function evAgg(ev){const g={n:0,c:0,qs:0,dp:0,adj:0,l:{}};Object.keys(ev||{}).forEach(k=>{const e=ev[k];if(e.t==='q'){g.n++;g.c+=e.ok?1:0;g.qs+=e.pts||0;const l=g.l[e.lv]||(g.l[e.lv]=[0,0]);l[0]++;l[1]+=e.ok?1:0}else if(e.t==='p')g.dp+=e.pts||0;else if(e.t==='a')g.adj+=e.pts||0});return g}
function mergeDay(x,y){
  const U=Object.assign({},x.ev||{},y.ev||{}),ga=evAgg(U);
  const rem=q=>{const g=evAgg(q.ev),l={};Object.keys(q.l||{}).forEach(k=>{const v=q.l[k],e=g.l[k]||[0,0];l[k]=[Math.max(0,v[0]-e[0]),Math.max(0,v[1]-e[1])]});
    return{a:Math.max(0,(q.a|0)-g.n),c:Math.max(0,(q.c|0)-g.c),p:Math.max(0,(q.p||0)-g.qs-g.dp),adj:(q.adj||0)-g.adj,l,n:q.n|0}};
  const rx=rem(x),ry=rem(y),R={a:Math.max(rx.a,ry.a),c:Math.max(rx.c,ry.c),p:Math.max(rx.p,ry.p),adj:Math.abs(rx.adj)>=Math.abs(ry.adj)?rx.adj:ry.adj};
  const z=Object.assign({},x,y);
  z.a=R.a+ga.n;z.c=R.c+ga.c;
  const qp=Math.min(QCAP,Math.max(0,R.p+ga.qs));z.q=qp;z.p=r1(qp+ga.dp);z.adj=r1(R.adj+ga.adj);z.n=Math.max(rx.n,ry.n);
  const l={};[rx.l,ry.l].forEach(L=>Object.keys(L).forEach(k=>{const o=l[k]||(l[k]=[0,0]);o[0]=Math.max(o[0],L[k][0]);o[1]=Math.max(o[1],L[k][1])}));
  Object.keys(ga.l).forEach(k=>{const o=l[k]||(l[k]=[0,0]);o[0]+=ga.l[k][0];o[1]+=ga.l[k][1]});
  z.l=l;z.ev=U;return z}
/* iki cihazın durumunu birleştirir: hiçbir cihazın ilerlemesi kaybolmaz */
function mergeStates(a,b){
  if(b.rs&&b.rs>(a.upd||0)&&b.rs>(a.rs||0))return normState(b);   // buluttaki açık sıfırlama, yerel son değişiklikten yeni
  if(a.rs&&a.rs>(b.upd||0)&&a.rs>(b.rs||0))return normState(a);
  const aa=stAns(a),bb=stAns(b);
  const base=aa>bb||(aa===bb&&(a.upd||0)>=(b.upd||0))?a:b,oth=base===a?b:a;
  const m=normState(JSON.parse(JSON.stringify(base)));
  const ot=JSON.parse(JSON.stringify(oth));
  Object.keys(ot.learned||{}).forEach(w=>{const a=m.learned[w],b=ot.learned[w];if(!a)m.learned[w]=b;else if(b&&((b.lr||'')>(a.lr||'')||(b.n|0)>(a.n|0))){a.lr=b.lr;a.n=Math.max(a.n|0,b.n|0)}});
  Object.keys(ot.prog||{}).forEach(w=>{if(m.learned[w])return;const x=m.prog[w]||(m.prog[w]=[]);(ot.prog[w]||[]).forEach(f=>{if(x.indexOf(f)===-1)x.push(f)})});
  Object.keys(m.learned).forEach(w=>{delete m.prog[w]});
  const bd=Object.assign({},ot.bd||{}),mb=m.bd||{};Object.keys(mb).forEach(k=>{bd[k]=bd[k]&&bd[k]<mb[k]?bd[k]:mb[k]});m.bd=bd;
  m.bs=Math.max(m.bs||0,ot.bs||0);m.br=Math.max(m.br||0,ot.br||0);
  Object.keys(ot.days||{}).forEach(k=>{const x=m.days[k],y=ot.days[k],nt=q=>q?(q.p||0)+(q.adj||0):0;
    if(!x){m.tp=Math.max(0,(m.tp||0)+nt(y));m.days[k]=y;return}
    let z;
    if(x.ev||y.ev)z=mergeDay(x,y);else if((y.a|0)>(x.a|0))z=y;else return;
    m.tp=Math.max(0,(m.tp||0)+nt(z)-nt(x));m.days[k]=z});   // gün başka cihazdan alınırsa/birleşirse farkı toplam puana da yansıt   // gün başka cihazdan alınırsa farkı toplam puana da yansıt
  Object.keys(ot.lv||{}).forEach(k=>{const x=m.lv[k],y=ot.lv[k];m.lv[k]=x?[Math.max(x[0]|0,y[0]|0),Math.max(x[1]|0,y[1]|0)]:y});
  m.dl=Object.assign({},ot.dl||{},m.dl||{});Object.keys(ot.dl||{}).forEach(k=>{const x=m.dl[k],y=ot.dl[k];if(x&&y){x.s=x.s||y.s;x.p=x.p||y.p}});
  {const sv={};[ot.sav||{},m.sav||{}].forEach(o=>Object.keys(o).forEach(k=>{if(sv[k]==null||Math.abs(o[k])>Math.abs(sv[k]))sv[k]=o[k]}));m.sav=sv}   // kaydedilenler: sayı >0 kayıtlı, <0 kaldırıldı (|değer| = zaman); yeni olan kazanır
  {const x=m.wq||{},y=ot.wq||{};if(y.d&&(!x.d||y.d>x.d))m.wq={d:y.d,done:(y.done||[]).slice()};else if(y.d&&y.d===x.d){const u=(x.done||[]).slice();(y.done||[]).forEach(k=>{if(u.indexOf(k)===-1)u.push(k)});m.wq={d:x.d,done:u}}}
  {const rv={};[ot.rwd||{},m.rwd||{}].forEach(o=>Object.keys(o).forEach(k=>{if(rv[k]==null||Math.abs(o[k])>Math.abs(rv[k]))rv[k]=o[k]}));m.rwd=rv}   // ödül bildirimleri: görülenler birleşir
  m.upd=Date.now();
  return m;
}

let pullT=null;
function schedulePull(ms){clearTimeout(pullT);pullT=setTimeout(()=>{syncPull(true)},ms||10000)}
async function pullState(){
  const r=await sb.from('user_state').select('state').eq('user_id',CLOUD.uid).maybeSingle();
  if(r.error)throw r.error;
  const d=r.data,cl=d&&d.state;
  CLOUD.pullAt=Date.now();
  const rst=!!(cl&&cl.rs&&cl.rs>(S.upd||0)&&cl.rs>(S.rs||0));   // bulutta, bu cihazdaki son değişiklikten yeni bir açık sıfırlama var
  if(!rst&&(!cl||stEmpty(cl))){
    CLOUD.known=0;CLOUD.pulled=true;
    if(!stEmpty(S)||!d)save();
    return false;
  }
  const before=stSig(S);
  const m=rst||stEmpty(S)?normState(cl):mergeStates(S,normState(cl));
  const changed=stSig(m)!==before;
  if(changed){S=m;S.upd=Date.now();persistLocal()}
  CLOUD.known=stAns(S);CLOUD.pulled=true;
  if(stSig(S)!==stSig(normState(cl))||(S.rs||0)>(cl.rs||0))schedulePush();   // bulutta olmayan yerel ilerleme varsa yukarı gönder
  return changed;
}
async function syncPull(retry){
  if(!sb||!CLOUD.uid||CLOUD.approved===false||!navigator.onLine||CLOUD.pulling){if(retry&&!CLOUD.pulled)schedulePull(15000);return}
  CLOUD.pulling=true;
  try{
    const ch=await pullState();
    if(ch){applyDecay();evalAwards();persistLocal();if(!UI.quiz&&!DUEL.bot&&['play','count','search','wait'].indexOf(DUEL.phase)===-1&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))render()}
  }catch(e){if(!CLOUD.pulled)schedulePull(15000)}
  finally{CLOUD.pulling=false}
}

    render();
  }
}

async function loadFlags(){
  if(!sb||!CLOUD.uid)return;
  try{
    const r=await sb.rpc('all_flags');if(r.error)throw r.error;
    const m={};(r.data||[]).forEach(x=>{m[x.user_id]=x.flag});
    const ch=JSON.stringify(m)!==JSON.stringify(CLOUD.flags)||CLOUD.flagsErr;
    CLOUD.flags=m;CLOUD.flagsErr=false;if(ch)quietRender2();
  }catch(e){if(!CLOUD.flagsErr){CLOUD.flagsErr=true;quietRender2()}}
}

async function setFlag(uid,fid){
  const A=UI.adm;A.fbusy=uid;render();
  try{const r=await sb.rpc('admin_set_flag',{target:uid,flag_id:fid||null});if(r.error)throw r.error;
    if(fid)CLOUD.flags[uid]=fid;else delete CLOUD.flags[uid];CLOUD.flagsErr=false;
    toast(fid?'Flama verildi.':'Flama kaldırıldı.')}
  catch(e){toast(/PGRST202|42883|schema cache|does not exist/i.test(String((e&&(e.message||e.code))||''))?'Flama özelliği için supabase-flags.sql çalıştırılmalı.':'İşlem yapılamadı.')}
  A.fbusy=null;render();
}
function agoTr(ms){
  const m=Math.floor(ms/6e4);
  if(m<1)return'şimdi';if(m<60)return m+' dk önce';
  const h=Math.floor(m/60);if(h<24)return h+' sa önce';
  const d=Math.floor(h/24);if(d<30)return d+' gün önce';
  const mo=Math.floor(d/30);return mo<12?mo+' ay önce':Math.floor(mo/12)+' yıl önce';
}

function newItems(n,level,skip){
  const bk={};LEVELS.forEach(l=>{bk[l]=[]});
  W.forEach(w=>{if(!S.learned[w.word]&&lvOk(level,w.level)&&typeOK(w)&&!skip.has(w.word))(bk[w.level]||(bk[w.level]=[])).push(w)});

  const wt=LVW[Math.min(myLeague(),LVW.length-1)],out=[];
  while(out.length<n){
    let tot=0;const av=LEVELS.map((l,i)=>{const x=bk[l].length?wt[i]:0;tot+=x;return x});
    if(!tot)break;
    let r=Math.random()*tot,li=0;for(;li<av.length-1;li++){r-=av[li];if(r<0)break}

}

    for(const f of order){const it=makeItem(w,f,'review');if(it){out.push(it);break}}

function applyAnswerCore(it,ok,ua,qz,gate){
  const w=it.w,bw0=S.wrong[w.word],p0=S.prog[w.word]||[];
  const elig=!gate||(it.kind==='new'&&!S.learned[w.word]&&p0.indexOf(it.f)===-1)||(!!bw0&&(it.f===0||it.f===1));
  const ap=(v,k)=>elig?addPts(gate?v*0.5:v,k):0;   // düelloda test puanı yarıya iner
  if(ok){S.run=(S.run||0)+1;if(S.run>(S.br||0))S.br=S.run}else S.run=0;
  const d=dayStat();
  d.a++;if(ok)d.c++;

  lv[ok?0:1]++;
  const dl=d.l||(d.l={});const dv=dl[w.level]||(dl[w.level]=[0,0]);dv[0]++;if(ok)dv[1]++;

  const bw=S.wrong[w.word];

    qz.right++;
    if(it.kind==='new'){
      const p=S.prog[w.word]||(S.prog[w.word]=[]);
      if(p.indexOf(it.f)===-1)p.push(it.f);
      if(applicable(w).every(f=>p.indexOf(f)!==-1)){

    }
  }

}

function posGroup(w){
  const t=str(w.pos).toLowerCase().trim();

  if(/^preposition phrase/.test(t))return'preposition phrase';
  if(/^(adverb|adjective) phrase/.test(t))return'phrase';
  if(/^proverb/.test(t))return'proverb';
  if(/^(prefix|suffix)/.test(t))return'prefix/suffix';
  if(/^(exclamation|interjection)/.test(t))return'exclamation';
  const k=posKey(w);
  if(['noun','verb','adjective','adverb','phrase','collocation','idiom','conjunction','preposition'].indexOf(k)!==-1)return k;
  return'diğer';
}

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
let VOICES=[];
try{const lv=()=>{VOICES=speechSynthesis.getVoices()};lv();speechSynthesis.addEventListener('voiceschanged',lv)}catch(e){}
function say(word,pron){
  try{
    const clean=String(word).replace(/\s*\([^)]*\)/g,'').split('/')[0];
    VOICES=speechSynthesis.getVoices()||VOICES;
    const us=VOICES.filter(v=>/^en[-_]US$/i.test(v.lang));
    const en=us.length?us:VOICES.filter(v=>/^en([-_]|$)/i.test(v.lang));
    const pick=en.find(x=>/google|samantha|aaron|alex|jenny|aria|natural/i.test(x.name))||en[0];
    let u;
    if(pick){
      u=new SpeechSynthesisUtterance(clean);u.voice=pick;u.lang=pick.lang||'en-US';u.rate=.9;
    }else if(pron){
      // İngilizce ses yoksa Türkçe okunuşu Türkçe sesle seslendir (fever -> fi-vır)
      u=new SpeechSynthesisUtterance(String(pron).replace(/-/g,'').toLowerCase());u.lang='tr-TR';u.rate=.85;
      toast('Bu cihazda İngilizce ses yok, Türkçe okunuş okunuyor.');
    }else{
      u=new SpeechSynthesisUtterance(clean);u.lang='en-US';u.rate=.9;
    }
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast('Bu cihazda sesli okuma yok.')}
}

async function chatFetchDm(after){
  const out=[];let last=after||0;
  for(let k=0;k<50;k++){
    const r=await sb.from('chat_messages').select(CHCOLS).not('to_user','is',null).gt('id',last).order('id',{ascending:true}).limit(1000);
    if(r.error)throw r.error;
    const d=r.data||[];out.push(...d);
    if(d.length<1000)break;
    last=d[d.length-1].id;
  }
  return out;
}
async function chatLoad(wait){
  if(!sb||!CLOUD.uid||CLOUD.approved===false||!navigator.onLine)return;
  if(CHAT.busy){if(!wait)return;while(CHAT.busy)await sleep(60)}
  CHAT.busy=true;
  try{
    const a=await sb.from('chat_messages').select(CHCOLS).is('to_user',null).order('id',{ascending:false}).limit(80);
    if(a.error)throw a.error;
    CHAT.pub=(a.data||[]).slice().reverse();
    const now=Date.now();
    if(!CHAT.ready||now-(CHAT.dmFull||0)>300000){CHAT.dm=await chatFetchDm(0);CHAT.dmFull=now}

function seededQs(seed,n){
  const orig=Math.random;let a=seed>>>0;

      const fs=applicable(w);if(!fs.length)continue;
      const f=fs[Math.floor(Math.random()*fs.length)];
      const b=buildQuestion(w,f);if(!b)continue;
      out.push({w,f,question:b.question,correct:b.correct,options:shuffle([b.correct].concat(b.distractors))});
    }

      ${DUEL.bot?'<div class="muted small">Alıştırma maçı kayda geçmez, puan bahsi yoktur.</div>':d.mode==='ranked'?(()=>{const dl=d.p1===CLOUD.uid?d.dl1:d.dl2;if(dl==null)return'<div class="muted small">Puan değişimi hesaplanıyor…</div>';const v=+dl,od=d.p1===CLOUD.uid?d.dl2:d.dl1,tr=Math.max(Math.abs(v),Math.abs(+od||0)),tx=v>0?Math.round((tr-v)*10)/10:0;return`<div class="kp" style="grid-template-columns:repeat(2,1fr)"><div><b style="color:${v>0?'var(--ok)':v<0?'var(--bad)':'inherit'}">${v>0?'+':v<0?'−':'±'}${nf(r1(Math.abs(v)))}</b><span>dereceli puan</span></div><div><b>${nf(r1(S.tp||0))}</b><span>yeni toplam</span></div></div><div class="muted small">${draw?'Berabere kaldınız, kimse puan kaybetmedi.':`Geçen puan: ${nf(r1(tr))}${tx>0?` · kesinti: ${nf(r1(tx))}`:''}`}</div>`})():(()=>{const pay=d.pay1==null?null:(d.p1===CLOUD.uid?d.pay1:d.pay2);return pay==null?'<div class="muted small">Puan dağıtımı hesaplanıyor…</div>':`<div class="kp" style="grid-template-columns:repeat(3,1fr)"><div><b>−${DSTAKE}</b><span>bahis</span></div><div><b>+${nf(r1(+pay))}</b><span>kazanç</span></div><div><b>${(+pay-DSTAKE)>=0?'+':'−'}${nf(r1(Math.abs(+pay-DSTAKE)))}</b><span>net puan</span></div></div>`})()}
      <button class="btn primary block" data-act="duel-find">Yeni rakip bul</button>
      <button class="btn block" data-act="duel-exit">Çık</button></div>`;
  }
  const inGame=['count','play','wait'].includes(P);
  const rkv=DUEL.sub==='ranked'||(d&&d.mode==='ranked'&&P!=='lobby');
  return`<div class="top"><h1>Düello</h1></div><div class="stack${rkv?' vlv pg':''}">${P==='lobby'?seg:''}${body}</div>`;
}
function setTab(t){

  if(t==='rank'||t==='today')refreshBoard();

}

document.addEventListener('input',e=>{
  if(e.target.id==='fbq'){UI.fb.draft=e.target.value;return}
  if(e.target.id==='chin'){UI.chat.draft=e.target.value;return}
  if(e.target.id==='chq'){UI.chat.q=e.target.value;chatFind(e.target.value);const pos=e.target.selectionStart;render();const n=document.getElementById('chq');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(e.target.dataset&&e.target.dataset.fid){UI.afb.reply[e.target.dataset.fid]=e.target.value;return}
  if(e.target.id==='annq'){UI.adm.annDraft=e.target.value;return}
  if(e.target.id==='liveq'){UI.adm.liveDraft=e.target.value;return}
  if(e.target.hasAttribute&&e.target.hasAttribute('data-arr')){UI.arp.reply[e.target.getAttribute('data-arr')]=e.target.value;return}
  if(e.target.id==='chu'){UI.chat.uq=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('chu');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(e.target.id==='fq'){UI.adm.fq=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('fq');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(e.target.id==='adq'){UI.adm.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('adq');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(e.target.id==='q'){UI.dict.q=e.target.value;UI.dict.limit=40;UI.dict.open=null;$('#dlist').innerHTML=dictList()}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='posf'){UI.dict.pos=e.target.value;UI.dict.limit=40;render()}
  else if(id==='goal'){S.set.goal=+e.target.value;save();toast('Hedef güncellendi.')}
  else if(id==='hour'){S.set.hour=+e.target.value;save()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.card){UI.card=null;render();return}
  if(e.key==='Enter'&&e.target.id==='chin'){e.preventDefault();chatSend();return}
  if(e.key==='Enter'&&!CLOUD.uid&&/^au-/.test(e.target.id||'')){e.preventDefault();doAuth();return}
  if(UI.tab==='quiz'&&DUEL.phase==='play'&&!UI.quiz&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.key>='1'&&e.key<='4'){duelAnswer(+e.key-1);return}
  if(UI.tab!=='quiz'||!UI.quiz||UI.quiz.done)return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const it=UI.quiz.items[UI.quiz.i];
  if(e.key>='1'&&e.key<='4'&&it.chosen===null){answer(+e.key-1)}
  else if((e.key==='Enter'||e.key===' ')&&it.chosen!==null){e.preventDefault();next()}
});
function syncDraft(){
  UI.focusName=document.activeElement&&document.activeElement.id==='pname';
  if(!UI.draft)UI.draft=newDraft();
  const n=document.getElementById('pname');
  if(n)UI.draft.name=n.value;
}
function importBackup(){
  const v=($('#bk')||{}).value||'';
  try{
    const p=JSON.parse(v);
    if(!p||typeof p!=='object'||!p.learned||!p.prog)throw 0;
    S=Object.assign(fresh(),p);S.set=Object.assign(fresh().set,p.set||{});S.prof=Object.assign(fresh().prof,p.prof||{});S.rs=Date.now();save();render();toast('Yedek yüklendi.');
  }catch(e){toast('Yedek metni geçersiz.')}
}
function toggleNotif(){
  if(S.set.notif){S.set.notif=false;save();render();return}
  if(!('Notification' in window)){toast('Bu tarayıcı bildirimleri desteklemiyor.');return}
  try{
    Notification.requestPermission().then(p=>{
      if(p==='granted'){S.set.notif=true;save();render();toast('Hatırlatma açıldı.')}
      else toast('Bildirim izni verilmedi.');
    }).catch(()=>toast('Bildirim izni alınamadı.'));
  }catch(e){toast('Bildirim izni alınamadı.')}
}
function maybeNotify(){
  try{
    if(!S.set.notif||!('Notification' in window)||Notification.permission!=='granted')return;
    if(new Date().getHours()<S.set.hour||S.lastNotif===today())return;
    const left=goalEff()-dayStat().c;if(left<=0)return;
    new Notification('Kelime Defteri',{body:`Bugünkü hedefe ${left} doğru cevap kaldı.`});
    S.lastNotif=today();save();
  }catch(e){}
}
setInterval(maybeNotify,60000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(pushT);pushNow()}else{if(CLOUD.uid&&CLOUD.approved!==false&&applyDecay()>0)persistLocal();maybeNotify();if(UI.tab==='today')render()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e;if(UI.tab==='me'&&UI.me==='set')render()});
window.addEventListener('online',()=>{schedulePush();refreshBoard()});
setInterval(()=>{if(!document.hidden&&(UI.tab==='rank'||UI.tab==='today'))refreshBoard()},60000);
setInterval(()=>{if(document.hidden||!CLOUD.uid||CLOUD.approved===false||!navigator.onLine)return;loadMyFb();loadFlags();if(CLOUD.admin)loadAdminFb()},120000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
render();maybeNotify();initAuth();
})();
